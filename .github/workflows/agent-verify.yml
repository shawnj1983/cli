name: Agent verify
on:
  pull_request:
  push:
    branches:
      - trunk
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.0/install.sh | sudo sh -s -- -b /usr/local/bin v2.11.0
      - name: Agent verify
        run: bash script/agent-verify.sh
